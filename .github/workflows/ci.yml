name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    name: Go build & vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [telegram, webhook, maillink, _template]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
