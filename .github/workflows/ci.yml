name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    name: Go build & vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [telegram, webhook, maillink, _template]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...

  frontend:
    name: Web type-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [telegram, webhook, maillink, _template]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --no-frozen-lockfile
      - run: npx tsc --noEmit
