name: Publish plugins

# Publishes the plugin UI packages (@octarq/plugin-<name>) to public npm so the
# frontend half composes by name via `make plugin-build`. The packages are
# consumed as source (main: ./index.ts), so there is no build step.
#
# Manual only. First publish of a version succeeds; re-publishing the same
# version fails by design (bump the version to release again).
#
# Prerequisite: an `NPM_TOKEN` repo secret with publish rights to the public
# `@octarq` npm scope.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Which plugin to publish
        type: choice
        default: all
        options: [all, dns, links, mail, maillink, twofa]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@octarq"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -e
          targets="dns links mail maillink twofa"
          if [ "$PLUGIN" != "all" ]; then targets="$PLUGIN"; fi
          for p in $targets; do
            echo "::group::publish @octarq/plugin-$p"
            ( cd "$p/web" && pnpm publish --access public --no-git-checks )
            echo "::endgroup::"
          done
